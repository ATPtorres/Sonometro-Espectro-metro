plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atptorres.sonarlab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atptorres.sonarlab'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Tests deterministas para RMS / FFT con ondas generadas, sin micrófono físico.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
